; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = NGWOS_AWS_MQTT
default_envs = stonefly

[env:stonefly]
platform = atmelsam
board = envirodiy_stonefly_m4
framework = arduino
monitor_speed = 115200
board_build.variant = stonefly_m4
board_build.variants_dir = ${platformio.core_dir}/variants
board_build.ldscript = ${platformio.core_dir}/variants/stonefly_m4/linker_scripts/gcc/flash_with_bootloader.ld
; TinyGSM defines static constexpr members out-of-class in its headers, which
; only links (as implicit inline variables) under C++17.
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-DMS_AWS_IOT_MAX_CONNECTION_TIME=120000L
lib_ldf_mode = deep+
lib_compat_mode = soft
lib_deps =
	; ModularSensors develop still includes TinyGsmEnums.h, which newer TinyGSM
	; removed. Pin TinyGSM to the last commit that still has it (archive ZIP,
	; since the commit can't be git-cloned). Listed first so it is installed
	; before ModularSensors pulls TinyGSM master.
	https://github.com/EnviroDIY/TinyGSM/archive/95d4a57e57635d23f7dbdb9cf9659418f2021092.zip
	https://github.com/EnviroDIY/ModularSensors.git#a2b958523e917079b3412d2681dbaa714bccfb80
	https://github.com/EnviroDIY/Arduino-SDI-12.git#432e8e2174d26a105893fc9b076c5b8a04065abc
	https://github.com/EnviroDIY/StreamDebugger.git#c50dfcab27b1844124224b477a84824708ee0ef1
	https://github.com/EnviroDIY/Tally_Library.git#01e4bd4644f76e1dfd2076a75cb85e967bf66007
lib_ignore =
	Adafruit GFX Library
	Adafruit SH110X
	Adafruit SSD1306
	Adafruit TinyUSB Library
	RTCZero
